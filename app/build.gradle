plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.hourglass'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.hourglass'
        minSdk 31          // Android 12
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
